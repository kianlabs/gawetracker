# GaweTracker — Nginx config for Render.
#
# This is a template, not a drop-in config: Render assigns the public port at
# runtime through the PORT env var, and the port can change between deploys.
# The entrypoint copies this file to /etc/nginx/http.d/default.conf and
# substitutes __LISTEN_PORT__ before starting supervisord.
#
# Everything else mirrors deploy/fly/nginx.conf (gzip + static caching). The
# static-location ordering matters and must not be reshuffled.
server {
    listen __LISTEN_PORT__;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
