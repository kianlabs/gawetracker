server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # ── Compression ───────────────────────────────────────────────────────
    # nginx ships with gzip disabled by default, so the 76 KB HTML pages and
    # the 41 KB stylesheet were served raw. Compressing them cuts transfer to
    # ~6-8 KB per page load.
    # gzip_proxied is required because every public request arrives through
    # cloudflared, which sets X-Forwarded-For and would otherwise mark the
    # request as proxied and skip compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    # Without Cache-Control the browser revalidates every asset on each
    # navigation, and each revalidation is a full round trip through the
    # Cloudflare Access + tunnel chain. Let the browser reuse them instead.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
